plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = "${project.archives_base_name}-${project.minecraft_version}"
}

// Predictable download name: nyx-companion-<mcVersion>.jar (no mod version
// baked in). There is no remapJar on unobfuscated versions - plain jar is it.
tasks.named('jar') {
	archiveFileName = "nyx-companion-${project.minecraft_version}.jar"
}

repositories {
	mavenCentral()
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

def mcRange = "~${project.minecraft_version}"

processResources {
	inputs.property "version", project.version
	inputs.property "mc_range", mcRange
	filesMatching("fabric.mod.json") {
		expand "version": project.version, "mc_range": mcRange
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
