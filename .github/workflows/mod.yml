name: Build Mod

# Compiling a Fabric mod needs Minecraft, Yarn mappings and Fabric API pulled
# from Mojang's and Fabric's maven repos, so it has to build somewhere with
# open network access - hence CI rather than a local/sandboxed build.
#
# Runs on any push that touches the mod, so build breakages surface straight
# away, and attaches the built jar to the release when a tag is pushed.
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
    paths-ignore: []
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Versions I could verify are real as of my own knowledge. Extending
          # this upward to whatever's newest needs the exact Yarn mappings
          # build number and a matching Fabric API version, which I can't
          # currently verify without web access - see the project notes for
          # how to add a row here.
          - minecraft_version: '1.20.1'
            yarn_mappings: '1.20.1+build.10'
            loader_version: '0.16.5'
            fabric_version: '0.92.0+1.20.1'
          - minecraft_version: '1.20.4'
            yarn_mappings: '1.20.4+build.3'
            loader_version: '0.16.5'
            fabric_version: '0.97.2+1.20.4'
          - minecraft_version: '1.21'
            yarn_mappings: '1.21+build.9'
            loader_version: '0.16.5'
            fabric_version: '0.100.1+1.21'
          - minecraft_version: '1.21.1'
            yarn_mappings: '1.21.1+build.3'
            loader_version: '0.16.5'
            fabric_version: '0.102.0+1.21.1'
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # fabric-loom 1.7.x uses a Gradle Problems-reporting API that only
          # exists in newer Gradle releases. Without a project-local Gradle
          # wrapper, the runner's default pre-installed Gradle was too old
          # for it (NoSuchMethodError: Problems.forNamespace) - pinning an
          # explicit version here is the fix.
          gradle-version: '8.10'

      - name: Build mod for MC ${{ matrix.minecraft_version }}
        working-directory: mod
        run: >
          gradle build --no-daemon --stacktrace
          -Pminecraft_version=${{ matrix.minecraft_version }}
          -Pyarn_mappings=${{ matrix.yarn_mappings }}
          -Ploader_version=${{ matrix.loader_version }}
          -Pfabric_version=${{ matrix.fabric_version }}

      - name: Upload jar as artifact
        uses: actions/upload-artifact@v4
        with:
          name: nyx-companion-${{ matrix.minecraft_version }}
          path: mod/build/libs/*.jar

  # A single rolling release, separate from the app's own versioned
  # releases - mod jars and app versions change on different schedules, so
  # tying them together would mean the launcher needing to know which app
  # tag has the mod jars attached, which changes every release. This gives
  # one fixed, predictable download URL per Minecraft version instead:
  # github.com/<repo>/releases/download/mod-latest/nyx-companion-<mc>.jar
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all built jars
        uses: actions/download-artifact@v4
        with:
          pattern: nyx-companion-*
          path: jars
          merge-multiple: true

      - name: Flatten jar names (strip the -sources/-dev suffixes Loom adds)
        run: |
          mkdir -p out
          for f in jars/*.jar; do
            base=$(basename "$f")
            case "$base" in
              *-sources.jar|*-dev.jar) continue ;;
            esac
            cp "$f" "out/$base"
          done
          ls -la out

      - name: Publish to the mod-latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete mod-latest --yes --cleanup-tag || true
          gh release create mod-latest out/*.jar \
            --title "Nyx Companion mod (latest)" \
            --notes "Auto-published by CI from the mod/ source on every push to main. Not a versioned release - always the newest successful build per Minecraft version." \
            --prerelease
