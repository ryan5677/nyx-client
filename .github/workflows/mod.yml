name: Build Mod

# Compiling a Fabric mod needs Minecraft, Yarn mappings and Fabric API pulled
# from Mojang's and Fabric's maven repos, so it has to build somewhere with
# open network access - hence CI rather than a local/sandboxed build.
#
# Runs on any push that touches the mod, so build breakages surface straight
# away, and attaches the built jar to the release when a tag is pushed.
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
    paths-ignore: []
  workflow_dispatch:

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        run: |
          # Asks Fabric's own services which mappings / loader / Fabric API
          # exist for each Minecraft version, so none of it is hard-coded.
          python3 mod/plan.py $MOJANG_FLAG | tee matrix.json
          echo "matrix=$(cat matrix.json)" >> "$GITHUB_OUTPUT"
        env:
          MOJANG_FLAG: ${{ hashFiles('mod26/build.gradle') != '' && '--mojang' || '' }}

  build:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up Gradle ${{ matrix.gradle }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ matrix.gradle }}

      - name: Build mod for MC ${{ matrix.mc }}
        working-directory: ${{ matrix.dir }}
        shell: bash
        run: |
          set +e
          gradle build --no-daemon --stacktrace \
            -Pminecraft_version=${{ matrix.mc }} \
            -Pyarn_mappings=${{ matrix.yarn }} \
            -Ploader_version=${{ matrix.loader }} \
            -Pfabric_version=${{ matrix.api }} \
            -Ploom_version=${{ matrix.loom }} 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # The raw Actions log isn't readable without signing in, so surface
            # the compiler's own error lines as annotations anyone can see.
            msg=$(grep -E "error:|\.java:[0-9]+|What went wrong|Could not|not found|cannot find|Unsupported|requires" -A2 build.log | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Mod build failed (MC ${{ matrix.mc }})::${msg:0:3500}"
          fi
          exit $status

      - name: Upload jar as artifact
        uses: actions/upload-artifact@v4
        with:
          name: nyx-companion-${{ matrix.mc }}
          path: ${{ matrix.dir }}/build/libs/nyx-companion-${{ matrix.mc }}.jar

  # A single rolling release, separate from the app's own versioned
  # releases: one fixed download URL per Minecraft version, plus a
  # versions.json listing which versions actually built, so the launcher
  # knows what is supported without needing an update itself.
  publish:
    needs: build
    if: ${{ always() && needs.build.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all built jars
        uses: actions/download-artifact@v4
        with:
          pattern: nyx-companion-*
          path: jars
          merge-multiple: true

      - name: Collect jars and write versions.json
        run: |
          mkdir -p out
          cp jars/nyx-companion-*.jar out/
          ls -la out
          python3 - <<'PY'
          import glob, json, os, re
          vs = sorted(re.match(r"nyx-companion-(.+)\.jar", os.path.basename(f)).group(1) for f in glob.glob("out/*.jar"))
          json.dump({"versions": vs}, open("out/versions.json", "w"))
          print(vs)
          PY

      - name: Publish to the mod-latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete mod-latest --yes --cleanup-tag || true
          gh release create mod-latest out/* \
            --title "Nyx Companion mod (latest)" \
            --notes "Auto-published by CI from the mod sources on every push to main. Not a versioned release - always the newest successful build per Minecraft version." \
            --prerelease
