name: Build Mod

# Compiling a Fabric mod needs Minecraft, Yarn mappings and Fabric API pulled
# from Mojang's and Fabric's maven repos, so it has to build somewhere with
# open network access - hence CI rather than a local/sandboxed build.
#
# Runs on any push that touches the mod, so build breakages surface straight
# away, and attaches the built jar to the release when a tag is pushed.
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
    paths-ignore: []
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build mod
        working-directory: mod
        run: gradle build --no-daemon --stacktrace

      - name: Upload jar as artifact
        uses: actions/upload-artifact@v4
        with:
          name: nyx-companion-jar
          path: mod/build/libs/*.jar
