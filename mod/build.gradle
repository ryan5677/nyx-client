plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = "${project.archives_base_name}-${project.minecraft_version}"
}

// Gradle's default output name is "<archivesName>-<version>.jar", which
// would bake the mod's own version number into the filename and break the
// predictable download URL the launcher builds from just the Minecraft
// version (nyx-companion-<mcVersion>.jar). Loom produces the actual
// published jar via remapJar, not the plain jar task, so both need the
// override - setting only `jar` silently gets ignored by remapJar's own
// naming.
def jarName = "nyx-companion-${project.minecraft_version}.jar"
tasks.named('jar') {
	archiveFileName = jarName
}
tasks.named('remapJar') {
	archiveFileName = jarName
}

repositories {
	mavenCentral()
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

// Minecraft 1.20.x runs on Java 17 and only 1.20.5+ needs Java 21. A jar
// compiled for 21 simply fails to load on a 17 game (and Fabric would refuse
// it via the java requirement), so each jar is compiled for the Java level of
// the Minecraft version it targets.
def javaLevel = project.minecraft_version.startsWith('1.20') ? 17 : 21
// "~1.20.4" style range so the jar only claims the exact version it was built for.
def mcRange = "~${project.minecraft_version}"

// Minecraft changed some GUI APIs mid-1.21 (mouse events became Click objects
// in 1.21.9; the Graphics option went away in 1.21.11). Each variant of the
// affected classes lives in its own source folder and the right one is added
// for the version being built.
def mcParts = project.minecraft_version.split('\\.')
def mcMinor = mcParts.length > 1 ? mcParts[1].toInteger() : 0
def mcPatch = mcParts.length > 2 ? mcParts[2].toInteger() : 0
def clickApi = mcMinor > 21 || (mcMinor == 21 && mcPatch >= 9)
def gfxNone = mcMinor > 21 || (mcMinor == 21 && mcPatch >= 11)
sourceSets {
	main {
		java {
			srcDir clickApi ? 'src/compat_mouse_click/java' : 'src/compat_mouse_legacy/java'
			srcDir gfxNone ? 'src/compat_gfx_none/java' : 'src/compat_gfx_mode/java'
		}
	}
}

processResources {
	inputs.property "version", project.version
	inputs.property "mc_range", mcRange
	inputs.property "java_version", javaLevel.toString()
	filesMatching("fabric.mod.json") {
		expand "version": project.version, "mc_range": mcRange, "java_version": javaLevel.toString()
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = javaLevel
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.toVersion(javaLevel)
	targetCompatibility = JavaVersion.toVersion(javaLevel)
}
