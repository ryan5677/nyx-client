<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com data: https:; img-src 'self' data: https:; script-src 'self' 'unsafe-inline';" />
<title>Nyx Client — Skin Editor</title>
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="skin-editor.css" />
</head>
<body class="skin-editor-page">
  <div class="night-sky active" id="night-sky" aria-hidden="true"></div>
  <div id="toast" class="toast" hidden></div>

  <div class="skin-editor-app">
    <header class="skin-editor-topbar">
      <div class="skin-editor-brand">
        <img src="assets/nyx-glyph.png" alt="" class="brand-mark" />
        <span class="skin-editor-brand-text">Skin Editor</span>
      </div>
      <div class="skin-editor-actions">
        <button class="btn" id="btn-skin-new">New blank</button>
        <button class="btn" id="btn-skin-load-current">Load my skin</button>
        <button class="btn" id="btn-skin-import">Import PNG…</button>
        <button class="btn" id="btn-skin-export">Export PNG…</button>
        <button class="btn btn-accent" id="btn-skin-upload">Upload to account</button>
      </div>
    </header>

    <div class="skin-editor-layout-v2">
      <!-- TOOLS -->
      <div class="panel skin-editor-tools">
        <h3>Tools</h3>
        <div class="skin-tool-row" id="skin-tool-row">
          <button class="skin-tool-btn active" data-tool="pencil" title="Pencil">&#9998;</button>
          <button class="skin-tool-btn" data-tool="eraser" title="Eraser">&#11036;</button>
          <button class="skin-tool-btn" data-tool="fill" title="Fill bucket">&#9911;</button>
          <button class="skin-tool-btn" data-tool="eyedropper" title="Eyedropper">&#9679;</button>
        </div>

        <div class="field-row" style="margin-top: 16px;">
          <label>Brush size</label>
          <div class="segmented" id="skin-brush-segmented">
            <button class="segmented-btn active" data-brush="1">1px</button>
            <button class="segmented-btn" data-brush="2">2px</button>
            <button class="segmented-btn" data-brush="3">3px</button>
          </div>
        </div>

        <div class="field-row" style="margin-top: 16px;">
          <label>Color</label>
          <div class="swatch-row" id="skin-color-swatches">
            <button class="swatch" data-color="#3b2415" style="background:#3b2415" title="Dark brown"></button>
            <button class="swatch" data-color="#7a4a2a" style="background:#7a4a2a" title="Brown"></button>
            <button class="swatch" data-color="#d9a066" style="background:#d9a066" title="Skin tone"></button>
            <button class="swatch" data-color="#f2d3b3" style="background:#f2d3b3" title="Light skin tone"></button>
            <button class="swatch" data-color="#ffffff" style="background:#ffffff" title="White"></button>
            <button class="swatch" data-color="#1a1a1a" style="background:#1a1a1a" title="Black"></button>
            <button class="swatch" data-color="#4a7ccf" style="background:#4a7ccf" title="Blue"></button>
            <button class="swatch" data-color="#d64545" style="background:#d64545" title="Red"></button>
            <button class="swatch" data-color="#6f9d5a" style="background:#6f9d5a" title="Green"></button>
            <button class="swatch" data-color="#d6a72e" style="background:#d6a72e" title="Gold"></button>
            <input type="color" class="swatch-custom" id="skin-color-custom" title="Custom color" value="#8b5cf6" />
          </div>
          <div class="field-row inline" style="margin-top: 10px;">
            <input type="text" id="skin-color-hex" class="input input-small" maxlength="7" placeholder="#8b5cf6" />
          </div>
        </div>

        <div class="field-row" style="margin-top: 16px;">
          <label class="range-row-head" style="margin-bottom: 6px;">Model</label>
          <div class="segmented" id="skin-model-segmented">
            <button class="segmented-btn active" data-model="classic">Classic</button>
            <button class="segmented-btn" data-model="slim">Slim</button>
          </div>
        </div>

        <div class="field-row inline" style="margin-top: 16px;">
          <div class="toggle" id="skin-grid-toggle"></div>
          <label>Show part guides (2D)</label>
        </div>

        <div class="range-row" style="margin-top: 16px;">
          <div class="range-row-head">
            <label>2D zoom</label>
            <span class="range-row-value" id="skin-zoom-value">8x</span>
          </div>
          <input type="range" class="range-input" id="skin-zoom" min="4" max="16" step="1" value="8" />
        </div>

        <div class="field-row inline" style="margin-top: 16px; gap: 8px;">
          <button class="btn btn-small" id="btn-skin-undo">Undo</button>
          <button class="btn btn-small" id="btn-skin-redo">Redo</button>
        </div>
      </div>

      <!-- MAIN STAGE: 3D and 2D share this one area, only one shown at a time -->
      <div class="panel skin-editor-stage">
        <div class="skin-stage-topbar">
          <div class="segmented" id="skin-viewmode-segmented">
            <button class="segmented-btn active" data-viewmode="3d">3D</button>
            <button class="segmented-btn" data-viewmode="2d">2D</button>
          </div>
          <div class="skin-stage-topbar-right">
            <label class="checkbox"><input type="checkbox" id="skin-animate-toggle" /> Animate</label>
            <label class="checkbox"><input type="checkbox" id="skin-overlay-toggle" checked /> Overlay</label>
          </div>
        </div>

        <div class="skin-stage-3d" id="skin-stage-3d">
          <canvas id="skin-3d-canvas"></canvas>
          <span class="skin-3d-hint" id="skin-3d-hint">Left-click paints &middot; right-drag rotates &middot; scroll zooms</span>
        </div>

        <div class="skin-stage-2d" id="skin-stage-2d" hidden>
          <div class="skin-canvas-scroll" id="skin-canvas-scroll">
            <div class="skin-canvas-frame" id="skin-canvas-frame">
              <canvas id="skin-edit-canvas" width="64" height="64"></canvas>
              <canvas id="skin-grid-canvas" width="64" height="64"></canvas>
            </div>
          </div>
        </div>

        <p class="muted small" id="skin-cursor-pos">&nbsp;</p>
      </div>

      <!-- LAYERS -->
      <div class="panel skin-editor-layers">
        <div class="field-row inline" style="justify-content: space-between;">
          <h3 style="margin: 0;">Layers</h3>
          <button class="btn btn-small" id="btn-layer-add">+ Add</button>
        </div>
        <div class="skin-layers-list" id="skin-layers-list"><!-- injected --></div>
        <div class="field-row inline" style="margin-top: 10px; gap: 6px; flex-wrap: wrap;">
          <button class="btn btn-small" id="btn-layer-duplicate">Duplicate</button>
          <button class="btn btn-small" id="btn-layer-up">Up</button>
          <button class="btn btn-small" id="btn-layer-down">Down</button>
          <button class="btn btn-small btn-danger" id="btn-layer-delete">Delete</button>
        </div>
      </div>
    </div>
  </div>

  <script src="vendor/three.min.js"></script>
  <script src="vendor/skinview3d.bundle.js"></script>
  <script src="skin-editor-renderer.js"></script>
</body>
</html>
